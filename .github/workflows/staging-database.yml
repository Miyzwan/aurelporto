name: Staging Database

on:
  workflow_dispatch:
    inputs:
      include_seed:
        description: Run the development seed (enable only for an empty staging database)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-staging-database
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply staging migrations
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: v2.109.1

      - name: Verify deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Link staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show migration plan
        run: supabase migration list --linked

      - name: Apply migrations and optional staging seed
        shell: bash
        env:
          INCLUDE_SEED: ${{ inputs.include_seed }}
        run: |
          set -euo pipefail
          if [ "$INCLUDE_SEED" = "true" ]; then
            supabase db push --linked --include-seed
          else
            supabase db push --linked
          fi

      - name: Run staging RLS regression tests
        run: supabase test db --linked
